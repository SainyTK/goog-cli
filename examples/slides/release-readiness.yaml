  colors:
    canvas: "#FFFFFF"
    ink: "#111111"
    text: "#292929"
    muted: "#555555"
    panel: "#EDEDED"
    rule: "#B8BCC4"
    accent: "#FF6B35"
  fonts:
    heading:
      family: Arial
      fallbacks:
        - sans-serif
    body:
      family: Arial
      fallbacks:
        - sans-serif
  typeStyles:
    title:
      font: heading
      size: 30
      weight: bold
      lineSpacing: 1.05
      alignment: start
      color: ink
    subtitle:
      font: body
      size: 15
      lineSpacing: 1.2
      alignment: start
      color: muted
    body:
      font: body
      size: 12
      lineSpacing: 1.25
      alignment: start
      color: text
    label:
      font: body
      size: 9
      weight: bold
      lineSpacing: 1
      alignment: start
      color: muted
  spacing:
    pageMargin: 42
    sectionGap: 18
    itemGap: 12
  fills:
    canvas: canvas
    panel: panel
    accent: accent
  outlines:
    panel:
      color: rule
      width: 1
  lines:
    rule:
      color: rule
      width: 1
  geometry:
    safeArea:
      top: 24
      right: 24
      bottom: 24
      left: 24
    footer:
      height: 18
      gap: 12
  patternDefaults:
    footer:
      showSlideNumber: true
